<!doctype html>
<html dir="ltr" lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta name="color-scheme" content="dark"/>
        <meta name="description" content="本時鐘分為鐘面層和時針層。鐘面層靜止不動，標示 00 至 23 的小時刻度；時針層有 24 個時針，以 24 分之 1 turn 為間隔，標示 -12 至 +12 的時區偏移量，以逆時針方向每 24 小時旋轉一圈。"/>
        <link rel="stylesheet" href="./style.css"/>
        <script type="module" src="./script.js"></script>
        <meta name="google-site-verification" content="z1Ck4BAXxPBPm2I5wUjCPAGasxP-i3BfzUJ7wW3-EXs" />
        <title>Time Zone Clock</title>
    </head>
    <body>
        <div id="analog-clock">
            <canvas id="face" width="1000" height="1000"></canvas>
            <canvas id="hands" width="1000" height="1000"></canvas>
        </div>
        <div id="digital-clock"></div>
        <div id="license-info">Created by Jhonatan Kelvin. Licensed under the MPL 2.0.</div>
    </body>
</html>
